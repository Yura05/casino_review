<footer class="bg-slate-900 text-slate-300 text-sm">
  <div class="max-w-6xl mx-auto px-4 py-10 grid gap-8 sm:grid-cols-3">
    <div>
      <p class="text-white font-bold mb-2">{{ site_name }}</p>
      <p class="text-slate-400">{{ t.footer_tagline }}</p>
    </div>

    <nav class="flex flex-col gap-2">
      <a href="/{{ lang }}/18plus/" class="hover:text-white">{{ t.footer_responsible }}</a>
      <a href="/{{ lang }}/privacy/" class="hover:text-white">{{ t.footer_privacy }}</a>
      <a href="/{{ lang }}/pro-nas/" class="hover:text-white">{{ t.footer_about }}</a>
    </nav>

    <div class="text-slate-400 text-xs leading-relaxed">
      <p class="mb-2">
        <span class="font-bold text-rose-400">18+</span>
        {{ t.footer_18plus }}
      </p>
      <p>{{ t.footer_affiliate }}</p>
    </div>
  </div>

  <div class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    © {{ site_name }}. {{ t.footer_rights }}
  </div>
</footer>
