<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Олена Ткаченко">
  <defs>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3340"/>
      <stop offset="1" stop-color="#241f29"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>

    <!-- wlosy z tylu + dlugosc na ramionach -->
    <path d="M30 60 C30 30 46 18 64 18 C82 18 98 30 98 60 C98 84 94 104 90 118 L80 118 C84 96 84 80 82 70 L46 70 C44 80 44 96 48 118 L38 118 C34 104 30 84 30 60 Z" fill="url(#hair)"/>

    <!-- marynarka (ramiona) -->
    <path d="M24 128 C24 104 42 96 54 94 L74 94 C86 96 104 104 104 128 Z" fill="#047857"/>
    <!-- bluzka -->
    <path d="M54 94 L64 110 L74 94 L70 92 L64 100 L58 92 Z" fill="#ffffff"/>
    <!-- klapy marynarki -->
    <path d="M54 94 L64 110 L58 96 Z" fill="#065f46"/>
    <path d="M74 94 L64 110 L70 96 Z" fill="#065f46"/>

    <!-- szyja -->
    <path d="M57 86 L57 96 C57 100 71 100 71 96 L71 86 Z" fill="#e0a980"/>

    <!-- twarz -->
    <ellipse cx="64" cy="60" rx="22" ry="25" fill="#f2c6a0"/>
    <!-- uszy -->
    <circle cx="42" cy="62" r="4" fill="#f2c6a0"/>
    <circle cx="86" cy="62" r="4" fill="#f2c6a0"/>

    <!-- grzywka / przod wlosow -->
    <path d="M42 56 C40 34 52 24 64 24 C76 24 88 34 86 56 C84 44 80 40 74 39 C70 50 58 50 54 39 C48 40 44 44 42 56 Z" fill="url(#hair)"/>

    <!-- brwi -->
    <path d="M50 54 Q56 51 61 54" stroke="#2b2630" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M67 54 Q72 51 78 54" stroke="#2b2630" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- oczy -->
    <ellipse cx="55" cy="60" rx="3.4" ry="2.6" fill="#fff"/>
    <ellipse cx="73" cy="60" rx="3.4" ry="2.6" fill="#fff"/>
    <circle cx="55.5" cy="60.3" r="1.7" fill="#3a2f2a"/>
    <circle cx="73.5" cy="60.3" r="1.7" fill="#3a2f2a"/>

    <!-- nos -->
    <path d="M64 62 L62 68 Q64 70 66 68" stroke="#d59b72" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <!-- usta -->
    <path d="M58 74 Q64 79 70 74" stroke="#c2615e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- rumieniec -->
    <ellipse cx="51" cy="68" rx="3.5" ry="2.2" fill="#f0a98f" opacity=".5"/>
    <ellipse cx="77" cy="68" rx="3.5" ry="2.2" fill="#f0a98f" opacity=".5"/>
  </g>
</svg>
