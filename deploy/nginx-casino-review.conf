# Конфіг nginx: приймає трафік з інтернету (80/443) і передає застосунку
# на 127.0.0.1:8000. Статику (/static/) віддає сам nginx — швидше.
#
# Куди покласти на сервері:  /etc/nginx/sites-available/casino-review
# Активувати:
#   sudo ln -s /etc/nginx/sites-available/casino-review /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS НЕ прописуємо вручну — його додасть certbot автоматично (див. deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name casinorank.com.ua www.casinorank.com.ua;

    # Статика напряму з диска (швидко, з кешем у браузері).
    location /static/ {
        alias /home/casino/site_revie/app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Решта — у застосунок (uvicorn).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
